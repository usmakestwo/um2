<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" fill="none">
  <defs>
    <style>
      .tr { stroke: #1a5d46; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .nd { fill: #c4993a; }
    </style>
    <!-- Inter / Century Gothic approximation for text -->
  </defs>

  <!-- ── TRUNK BASE (chip socket) ── -->
  <rect x="208" y="383" width="44" height="40" rx="4" class="tr"/>

  <!-- ── MAIN TRUNK ── -->
  <line x1="230" y1="383" x2="230" y2="295" class="tr"/>

  <!-- ── PRIMARY SPLIT at y=295 ── -->
  <!-- Left arm  -->
  <polyline points="230,295 162,295 162,232" class="tr"/>
  <!-- Right arm -->
  <polyline points="230,295 298,295 298,232" class="tr"/>
  <!-- Centre continues up -->
  <line x1="230" y1="295" x2="230" y2="198" class="tr"/>

  <!-- ══ LEFT BRANCH SYSTEM (root: 162,232) ══ -->

  <!-- Outer-left fork  -->
  <polyline points="162,232  96,232  96,168" class="tr"/>
    <!-- Outer-left › far-left -->
    <polyline points="96,168  52,168  52,112" class="tr"/>
    <circle cx="52"  cy="105" r="9" class="nd"/>
    <!-- Outer-left › mid-up -->
    <line x1="96" y1="168" x2="96" y2="112" class="tr"/>
    <circle cx="96"  cy="105" r="9" class="nd"/>
    <!-- Outer-left › angled-right -->
    <line x1="96" y1="168" x2="136" y2="128" class="tr"/>
    <circle cx="139" cy="125" r="9" class="nd"/>

  <!-- Inner-left fork  -->
  <line x1="162" y1="232" x2="162" y2="162" class="tr"/>
    <!-- Inner-left › angled-left -->
    <line x1="162" y1="162" x2="126" y2="112" class="tr"/>
    <circle cx="123" cy="109" r="9" class="nd"/>
    <!-- Inner-left › straight-up -->
    <line x1="162" y1="162" x2="162" y2="105" class="tr"/>
    <circle cx="162" cy="98"  r="9" class="nd"/>

  <!-- ══ RIGHT BRANCH SYSTEM (root: 298,232) – mirror ══ -->

  <!-- Outer-right fork -->
  <polyline points="298,232  364,232  364,168" class="tr"/>
    <!-- Outer-right › far-right -->
    <polyline points="364,168  408,168  408,112" class="tr"/>
    <circle cx="408" cy="105" r="9" class="nd"/>
    <!-- Outer-right › mid-up -->
    <line x1="364" y1="168" x2="364" y2="112" class="tr"/>
    <circle cx="364" cy="105" r="9" class="nd"/>
    <!-- Outer-right › angled-left -->
    <line x1="364" y1="168" x2="324" y2="128" class="tr"/>
    <circle cx="321" cy="125" r="9" class="nd"/>

  <!-- Inner-right fork -->
  <line x1="298" y1="232" x2="298" y2="162" class="tr"/>
    <!-- Inner-right › angled-right -->
    <line x1="298" y1="162" x2="334" y2="112" class="tr"/>
    <circle cx="337" cy="109" r="9" class="nd"/>
    <!-- Inner-right › straight-up -->
    <line x1="298" y1="162" x2="298" y2="105" class="tr"/>
    <circle cx="298" cy="98"  r="9" class="nd"/>

  <!-- ══ CENTRE BRANCH SYSTEM (root: 230,198) ══ -->
  <!-- Centre › left spur -->
  <polyline points="230,198  192,198  192,138" class="tr"/>
  <circle cx="192" cy="131" r="9" class="nd"/>
  <!-- Centre › right spur -->
  <polyline points="230,198  268,198  268,138" class="tr"/>
  <circle cx="268" cy="131" r="9" class="nd"/>
  <!-- Centre › straight up -->
  <line x1="230" y1="198" x2="230" y2="108" class="tr"/>
  <circle cx="230" cy="101" r="9" class="nd"/>

  <!-- ── TEXT "UsMakesTwo" ── -->
  <text
    x="230"
    y="520"
    text-anchor="middle"
    font-family="'Century Gothic', 'Futura', 'Trebuchet MS', 'Gill Sans', sans-serif"
    font-size="66"
    font-weight="700"
    fill="#1a5d46"
    letter-spacing="-1"
  >UsMakesTwo</text>
</svg>
